<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sticker Generator — Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=7">

  <style>
    :root { --black:#111; --gray:#e5e7eb; --text:#333; --brand:#111; }
    body { background:#f6f7f9; font-family: system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif; }
    .chat-header{ position: sticky; top:0; z-index:10; background:var(--black); color:#fff; padding:12px 16px; }
    .chat-shell{ max-width:980px; margin:24px auto; padding:0 16px; }
    .msg{ background:#fff; border:1px solid var(--gray); border-radius:12px; padding:14px; margin:10px 0; }
    .btn{ display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--brand); cursor:pointer; }
    .btn-primary{ background:var(--brand); color:#fff; }
    .btn-ghost{ background:#fff; color:var(--brand); }
    .btn[disabled]{ opacity:.6; cursor:not-allowed; }
    .mini-btn{ height:34px; padding:0 10px; border-radius:8px; border:1px solid #D0D4DA; background:#fff; cursor:pointer }
    #dropzone{ width:100%; min-height:140px; background:#fff; border:2px dashed #cbd5e1; border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; transition: border-color .2s ease; }
  </style>
</head>

<body>
  <header class="chat-header"><div>Sticker Generator — Upload</div></header>

  <main class="chat-shell">
    <h1 style="font-size:20px;font-weight:700;">Upload an image to create your sticker</h1>

    <div id="messages"></div>

    <div id="dropzone">
      <div>
        <p style="margin-bottom:8px; color:#555;">Drag & drop your image here (PNG/JPG/WebP/GIF, &lt; 10MB)</p>
        <input id="file-input" type="file" accept="image/*" style="display:none;">
        <button class="btn btn-primary" id="choose-btn">Choose a file</button>
        <div id="file-info" style="margin-top:10px; color:#333;"></div>
      </div>
    </div>

    <div class="action-buttons" style="display:flex; gap:10px; margin-top:14px">
      <a class="btn btn-ghost" href="/">← Back</a>
      <button class="btn btn-primary" id="upload-btn" disabled>📦 Upload & Preview</button>
    </div>
  </main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const messages = document.getElementById('messages');
  const dropzone = document.getElementById('dropzone');
  const choose   = document.getElementById('choose-btn');
  const fileIn   = document.getElementById('file-input');
  const fileInfo = document.getElementById('file-info');
  const upload   = document.getElementById('upload-btn');

  const ALLOWED = ['image/png','image/jpeg','image/webp','image/gif'];
  const MAX_SIZE = 10 * 1024 * 1024; // 10MB，与后端一致

  let selectedFile = null;

  // 小工具
  function msg(text){
    const box = document.createElement('div');
    box.className = 'msg';
    box.textContent = text;
    messages.appendChild(box);
    box.scrollIntoView({behavior:'smooth',block:'end'});
  }
  function setBusy(btn, busy, labelBusy){
    if(!btn) return;
    if(busy){ btn.dataset._old = btn.textContent; btn.disabled = true; btn.textContent = labelBusy||'Working...'; }
    else{ btn.disabled = !selectedFile; if(btn.dataset._old){ btn.textContent = btn.dataset._old; } }
  }
  function renderFileInfo(){
    messages.innerHTML = '';
    fileInfo.innerHTML = '';
    upload.disabled = !selectedFile;
    if(!selectedFile) return;

    const okType = ALLOWED.includes(selectedFile.type);
    const okSize = selectedFile.size <= MAX_SIZE;
    const sizeKB = Math.round(selectedFile.size/1024);

    fileInfo.innerHTML = `
      Selected: ${selectedFile.name} (${sizeKB} KB)
      <button class="mini-btn" id="remove-btn">❌ Remove</button>
      <div style="margin-top:6px; color:${okType && okSize ? '#16a34a' : '#dc2626'}">
        ${okType ? '✓ Type OK' : '✗ Unsupported type'}
        &nbsp;•&nbsp;
        ${okSize ? '✓ Size OK' : '✗ Too large (>10MB)'}
      </div>
    `;

    if(!okType || !okSize){
      upload.disabled = true;
      msg('⚠️ Please choose a PNG/JPG/WebP/GIF within 10MB.');
    }
  }

  // 选择/拖拽
  choose.addEventListener('click', () => fileIn.click());
  fileIn.addEventListener('change', e => { selectedFile = e.target.files?.[0] || null; renderFileInfo(); });

  ['dragenter','dragover'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.style.borderColor = '#6366f1'; })
  );
  ['dragleave','drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.style.borderColor = '#cbd5e1'; })
  );
  dropzone.addEventListener('drop', e => { selectedFile = e.dataTransfer.files?.[0] || null; renderFileInfo(); });

  // 删除按钮（事件委托）
  document.addEventListener('click', (e) => {
    if(e.target && e.target.id === 'remove-btn'){
      selectedFile = null; fileIn.value = ''; renderFileInfo();
      msg('🗑️ File removed.');
    }
  });

  // 仅负责上传并跳转到预览页（后端返回 redirect_url）
  upload.addEventListener('click', async () => {
    if(!selectedFile){ msg('⚠️ Please select a file first.'); return; }
    setBusy(upload, true, 'Uploading...');
    try{
      const form = new FormData(); form.append('file', selectedFile);
      const res  = await fetch('/upload-image', { method:'POST', body:form });
      const data = await res.json();

      if(res.ok && data.redirect_url){
        window.location.href = data.redirect_url; // e.g. /preview/<filename>
        return;
      }
      msg('⚠️ Upload failed: ' + (data.error || 'Unknown error'));
    }catch(err){
      msg('⚠️ Error: ' + err);
    }finally{
      setBusy(upload, false);
    }
  });
});
</script>
</body>
</html>
