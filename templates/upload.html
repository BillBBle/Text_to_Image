<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sticker Generator — Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6">

  <style>
    :root { --black:#111; --gray:#e5e7eb; --text:#333; --brand:#111; }
    body { background:#f6f7f9; font-family: system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif; }
    .chat-header{ position: sticky; top:0; z-index:10; background:var(--black); color:#fff; padding:12px 16px; }
    .chat-shell{ max-width:980px; margin:24px auto; padding:0 16px; }
    .chat-box .msg{ background:#fff; border:1px solid var(--gray); border-radius:12px; padding:14px; margin:10px 0; }
    .generate-btn,.tune-btn{ display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--brand); background:var(--brand); color:#fff; cursor:pointer; }
    .tune-btn{ background:#fff; color:var(--brand) }
    .action-buttons{ display:flex; gap:10px; margin-top:14px }
    .mini-btn{ height:34px; padding:0 10px; border-radius:8px; border:1px solid #D0D4DA; background:#fff; cursor:pointer }
    #dropzone{ width:100%; min-height:140px; background:#fff; border:2px dashed #cbd5e1; border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; transition: border-color .2s ease; }
  </style>
</head>

<body>
  <header class="chat-header"><div>Sticker Generator — Upload (iframe)</div></header>

  <main class="chat-shell">
    <h1 style="font-size:20px;font-weight:700;">Upload an image to create your sticker</h1>

    <div id="chat-box" class="chat-box"></div>

    <div id="dropzone">
      <div>
        <p style="margin-bottom:8px; color:#555;">Drag & drop your image here (PNG/JPG/WebP/GIF, &lt; 10MB)</p>
        <input id="file-input" type="file" accept="image/*" style="display:none;">
        <button class="generate-btn" id="choose-btn">Choose a file</button>
        <div id="file-info" style="margin-top:10px; color:#333;"></div>
      </div>
    </div>

    <div class="action-buttons">
      <a class="tune-btn" href="/">← Back</a>
      <button class="generate-btn" id="upload-btn">📦 Upload & Preview</button>
    </div>
  </main>

  <div style="position:fixed;right:8px;bottom:8px;z-index:99999;background:#000;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;">
    <button id="btn-hello" style="margin-right:8px;">HELLO</button>
    <button id="btn-ping">PING</button>
    <span id="debug-status" style="margin-left:8px;opacity:.8">idle</span>
  </div>

<script>
(function(){
  const $status = document.getElementById('debug-status');
  const $hello  = document.getElementById('btn-hello');
  const $ping   = document.getElementById('btn-ping');

  // 计算父页 origin（若拿不到 referrer 就先用 * 做目标；等通了再收紧）
  let PARENT_ORIGIN = '*';
  try {
    if (document.referrer) PARENT_ORIGIN = new URL(document.referrer).origin;
  } catch {}

  function setStatus(msg){ $status.textContent = msg; console.log('[Child][DEBUG]', msg); }

  // 监听父页回执
  window.addEventListener('message', (event) => {
    console.log('[Child][DEBUG] message from', event.origin, 'data =', event.data);
    const data = event.data || {};
    if (data.type === 'PONG') {
      setStatus('PONG ✅ (ts=' + data.ts + ')');
    }
    if (data.type === 'HELLO_FROM_PARENT') {
      setStatus('HELLO_FROM_PARENT ✅');
    }
    // 你也可以在这里监听 STICKER_ADD_TO_CART_FAILED 等业务回执
  });

  // 测试 1：打招呼（父页回 HELLO_FROM_PARENT）
  $hello.addEventListener('click', () => {
    setStatus('send HELLO_FROM_CHILD → ' + PARENT_ORIGIN);
    window.parent.postMessage({ type: 'HELLO_FROM_CHILD', ts: Date.now() }, PARENT_ORIGIN);
  });

  // 测试 2：PING（父页回 PONG）
  $ping.addEventListener('click', () => {
    setStatus('send PING → ' + PARENT_ORIGIN);
    window.parent.postMessage({ type: 'PING', ts: Date.now() }, PARENT_ORIGIN);
  });

  // 页面加载后自动先打个招呼（可选）
  window.addEventListener('load', () => {
    setStatus('auto HELLO_FROM_CHILD → ' + PARENT_ORIGIN);
    window.parent.postMessage({ type: 'HELLO_FROM_CHILD', ts: Date.now() }, PARENT_ORIGIN);
  });
})();

document.addEventListener('DOMContentLoaded', () => {
  // ======= 你的店铺配置（已替换为你提供的）=======
  const SHOP_DOMAIN = 'https://www.getsiplit.com'; // ← 你的前台域名（含 https）
  const VARIANT_ID  = '50339879977245';            // ← 你的变体 ID
  // ===============================================

  const chatBox  = document.getElementById('chat-box');
  const fileIn   = document.getElementById('file-input');
  const choose   = document.getElementById('choose-btn');
  const upload   = document.getElementById('upload-btn');
  const dropzone = document.getElementById('dropzone');
  const fileInfo = document.getElementById('file-info');

  // 小工具
  function appendMsg(text) {
    const box = document.createElement('div');
    box.className = 'msg';
    box.textContent = text;
    chatBox.appendChild(box);
    box.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  function setBusy(btn, busy, labelWhenBusy) {
    if (!btn) return;
    if (busy) {
      btn.dataset._oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = labelWhenBusy || 'Working...';
    } else {
      btn.disabled = false;
      if (btn.dataset._oldText) btn.textContent = btn.dataset._oldText;
    }
  }

  // 当前成品信息（Confirm 用）
  let selectedFile    = null;
  let currentImageUrl = '';
  let currentWidth    = 0;
  let currentHeight   = 0;
  let currentShape    = '';
  let currentNotes    = '';

  // 选择/拖拽
  choose.addEventListener('click', () => fileIn.click());
  fileIn.addEventListener('change', e => { selectedFile = e.target.files?.[0] || null; renderFileInfo(); });

  ['dragenter','dragover'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.style.borderColor = '#6366f1'; })
  );
  ['dragleave','drop'   ].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.style.borderColor = '#cbd5e1'; })
  );
  dropzone.addEventListener('drop', e => { selectedFile = e.dataTransfer.files?.[0] || null; renderFileInfo(); });

  function renderFileInfo(){
    fileInfo.innerHTML = '';
    chatBox.innerHTML  = '';
    if(!selectedFile) return;
    const sizeKB = Math.round(selectedFile.size/1024);
    fileInfo.innerHTML = `
      Selected: ${selectedFile.name} (${sizeKB} KB)
      <button class="mini-btn" data-remove>❌ Remove</button>`;
  }

  // 统一事件委托
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest && e.target.closest('button');
    if (!btn) return;

    // 删除所选文件
    if (btn.matches('[data-remove]')) {
      selectedFile = null; fileIn.value = '';
      fileInfo.innerHTML = '';
      appendMsg('🗑️ File removed.');
      return;
    }

    // 上传文件并展示预览按钮组
    if (btn === upload) {
      if (!selectedFile) { appendMsg('⚠️ Please select a file first.'); return; }
      setBusy(upload, true, 'Uploading...');
      try {
        const form = new FormData(); form.append('file', selectedFile);
        const res  = await fetch('/upload-image', { method:'POST', body:form });
        const data = await res.json();

        if (data.redirect_url) { window.location.href = data.redirect_url; return; }
        if (!data.image_url)  { appendMsg('⚠️ Upload failed: ' + (data.error || 'Unknown error')); return; }

        // 记录当前图
        currentImageUrl = data.image_url;
        currentWidth = 0; currentHeight = 0; currentShape = ''; currentNotes = '';

        const imgId = 'img-' + Date.now();
        chatBox.innerHTML = `
          <div class="msg">
            ✅ Uploaded!<br/>
            <img id="${imgId}" src="${data.image_url}" style="max-width:100%; border-radius:12px; margin:8px 0;">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="mini-btn" data-resize data-img="${imgId}" data-url="${data.image_url}">🔧 Resize</button>
              <button class="mini-btn" data-reshape data-img="${imgId}" data-url="${data.image_url}">🔲 Reshape</button>
              <button class="mini-btn" data-download data-url="${data.image_url}">⬇️ Download</button>
              <button class="generate-btn" data-confirm>✅ Confirm</button>
            </div>
          </div>`;
      } catch (err) {
        appendMsg('⚠️ Error: ' + err);
      } finally {
        setBusy(upload, false);
      }
      return;
    }

    // Resize
    if (btn.matches('[data-resize]')) {
      const url   = btn.getAttribute('data-url');
      const imgId = btn.getAttribute('data-img');
      const w = prompt('Enter new width (px):',  '512');
      const h = prompt('Enter new height (px):', '512');
      if (!w || !h) return;

      try {
        const res  = await fetch('/resize', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ image_url:url, width:+w, height:+h })
        });
        const data = await res.json();
        if (data.resized_url) {
          currentImageUrl = data.resized_url;
          currentWidth  = +w;
          currentHeight = +h;
          document.getElementById(imgId).src = data.resized_url + '?t=' + Date.now();
        } else {
          appendMsg('Resize failed.');
        }
      } catch (err) { appendMsg('Error: ' + err); }
      return;
    }

    // Reshape
    if (btn.matches('[data-reshape]')) {
      const url   = btn.getAttribute('data-url');
      const imgId = btn.getAttribute('data-img');
      const s = (prompt('Enter shape (circle, rounded, square):', 'circle') || '').toLowerCase();
      if (!['circle','rounded','square'].includes(s)) { appendMsg('Invalid shape!'); return; }

      try {
        const res  = await fetch('/reshape', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ image_url:url, shape:s })
        });
        const data = await res.json();
        if (data.reshaped_url) {
          currentImageUrl = data.reshaped_url;
          currentShape = s;
          document.getElementById(imgId).src = data.reshaped_url + '?t=' + Date.now();
        } else {
          appendMsg('Reshape failed.');
        }
      } catch (err) { appendMsg('Error: ' + err); }
      return;
    }

    // Download
    if (btn.matches('[data-download]')) {
      const a = document.createElement('a');
      a.href = btn.getAttribute('data-url') || currentImageUrl;
      a.download = 'sticker.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      return;
    }

    // ✅ Confirm：使用顶层 POST 到 /cart/add，确保能加车
    if (btn.matches('[data-confirm]')) {
      if (!currentImageUrl) { appendMsg('⚠️ No image yet.'); return; }

      // 构造隐藏表单
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = `${SHOP_DOMAIN.replace(/\/$/,'')}/cart/add`; // 规范化域名
      form.target = '_top';  // 跳出 iframe，确保 Shopify 能设置 cart cookie
      form.style.display = 'none';

      const addField = (name, value) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = String(value);
        form.appendChild(input);
      };

      // 必填
      addField('id', VARIANT_ID);
      addField('quantity', '1');

      // 自定义属性
      addField('properties[Design URL]', currentImageUrl);
      if (currentWidth && currentHeight) addField('properties[Size]', `${currentWidth}x${currentHeight}px`);
      if (currentShape) addField('properties[Shape]', currentShape);
      if (currentNotes) addField('properties[Notes]', currentNotes);

      // 返回目的地
      addField('return_to', '/cart'); // 也可改成 /checkout

      document.body.appendChild(form);
      try { form.submit(); } finally { setTimeout(() => form.remove(), 1000); }
      return;
    }
  });   // 关闭全局 click
});     // 关闭 DOMContentLoaded
</script>
</body>
</html>
