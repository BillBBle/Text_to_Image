<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Preview Sticker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=8" />
  <style>
    .action-buttons{ display:flex; gap:10px; margin-top:14px }
    .tune-btn{ display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 14px; border-radius:10px; border:1px solid #111; background:#fff; color:#111; cursor:pointer; }
    .generate-btn{ display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 14px; border-radius:10px; border:1px solid #111; background:#111; color:#fff; cursor:pointer; }
    .resize-btn,.reshape-btn,.copy-btn{ height:34px; padding:0 10px; border-radius:8px; border:1px solid #D0D4DA; background:#fff; cursor:pointer }
    .preview-toolbar .tool-row{ display:flex; gap:8px; flex-wrap:wrap; }
  </style>
</head>
<body class="preview active-chat">
  <header class="chat-header">
    <div class="header-left">Sticker Generator — Preview</div>
  </header>

  <main class="chat-shell" id="chat-shell">
    <h1 class="welcome">Preview Your Sticker</h1>

    <div id="chat-box" class="chat-box">
      <div class="preview-card">
        <div class="preview-title">🖼️ Your Uploaded Image</div>

        <div class="image-frame">
          <img id="preview-img"
               class="preview-image"
               src="{{ url_for('serve_upload', filename=filename) }}"
               alt="Uploaded image">
        </div>

        <div class="preview-toolbar">
          <div class="tool-row">
            <button class="resize-btn"  id="btn-resize">🔧 Resize</button>
            <button class="reshape-btn" id="btn-reshape">🔲 Reshape</button>
            <button class="copy-btn"    id="btn-download">⬇️ Download</button>
          </div>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <a class="tune-btn" href="/upload">← Back</a>
      <button class="generate-btn" id="btn-confirm">✅ Confirm</button>
    </div>
  </main>

<script>
/** ====== 店铺/商品配置（按需修改） ====== */
const SHOP_DOMAIN         = 'https://www.getsiplit.com';  // 你的店铺域名（带 https）
const DEFAULT_VARIANT_ID  = '50339879977245';             // 兜底变体ID
const ACK_TIMEOUT_MS      = 1500;
/** ===================================== */

const imgEl = document.getElementById('preview-img');

let currentWidth  = 0;
let currentHeight = 0;
let currentShape  = '';
let currentNotes  = '';

function toRelPath(url) {
  try { const u = new URL(url, window.location.origin); return u.pathname.replace(/^\/+/, ''); }
  catch { return url.replace(/^\/+/, ''); }
}
function getCurrentImageUrl() { return imgEl.src; }
function inIframe() { try { return window.self !== window.top; } catch { return true; } }
function getParentOrigin() { try { if (document.referrer) return new URL(document.referrer).origin; } catch {} return '*'; }

/** ====== Resize / Reshape / Download ====== */
document.getElementById('btn-resize').addEventListener('click', async () => {
  const w = prompt('New width (px)?',  '512');
  const h = prompt('New height (px)?', '512');
  if (!w || !h) return;

  try {
    const res = await fetch('/resize', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        image_url: toRelPath(getCurrentImageUrl()),
        width: parseInt(w,10),
        height: parseInt(h,10)
      })
    });
    const data = await res.json();
    if (data.resized_url) {
      currentWidth  = parseInt(w,10);
      currentHeight = parseInt(h,10);
      imgEl.src = data.resized_url + '?t=' + Date.now();
    } else { alert('Resize failed'); }
  } catch (e) { alert('Resize error: ' + e); }
});

document.getElementById('btn-reshape').addEventListener('click', async () => {
  const s = (prompt('Shape? (circle, rounded, square)', 'circle') || '').toLowerCase();
  if (!['circle','rounded','square'].includes(s)) { alert('Invalid shape'); return; }

  try {
    const res = await fetch('/reshape', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        image_url: toRelPath(getCurrentImageUrl()),
        shape: s
      })
    });
    const data = await res.json();
    if (data.reshaped_url) {
      currentShape = s;
      imgEl.src = data.reshaped_url + '?t=' + Date.now();
    } else { alert('Reshape failed'); }
  } catch (e) { alert('Reshape error: ' + e); }
});

document.getElementById('btn-download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = getCurrentImageUrl();
  a.download = 'sticker.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

/** ====== Confirm：postMessage→等待ACK；超时→跳中转页 ====== */
document.getElementById('btn-confirm').addEventListener('click', () => {
  const imageUrl = getCurrentImageUrl();
  const variantId = new URLSearchParams(location.search).get('variant_id') || DEFAULT_VARIANT_ID;

  const payload = {
    type: 'STICKER_CONFIRM',
    quantity: 1,
    variantId,
    imageUrl,
    width:  currentWidth  || 0,
    height: currentHeight || 0,
    shape:  currentShape  || '',
    notes:  currentNotes  || ''
  };

  // 不在 iframe 中：直接兜底
  if (!inIframe()) return fallbackToHandoff(payload);

  let handled = false;
  const onAck = (evt) => {
    const d = evt.data || {};
    if (d.type === 'STICKER_HANDLED') {
      handled = true;
      window.removeEventListener('message', onAck);
      if (d.status !== 'ok') fallbackToHandoff(payload);
    }
  };
  window.addEventListener('message', onAck);

  try {
    const parentOrigin = getParentOrigin();
    window.parent.postMessage(payload, parentOrigin);
  } catch (e) {
    console.warn('[Preview] postMessage throw, fallback:', e);
    window.removeEventListener('message', onAck);
    return fallbackToHandoff(payload);
  }

  setTimeout(() => {
    if (!handled) {
      console.warn('[Preview] no ACK from parent, fallback to handoff');
      window.removeEventListener('message', onAck);
      fallbackToHandoff(payload);
    }
  }, ACK_TIMEOUT_MS);
});

function fallbackToHandoff(p) {
  const params = new URLSearchParams({
    id:        p.variantId,
    quantity:  p.quantity,
    image_url: p.imageUrl,
    size: (p.width && p.height) ? `${p.width}x${p.height}px` : '',
    shape: p.shape || '',
    notes: p.notes || ''
  });
  const handoffUrl = `${SHOP_DOMAIN.replace(/\/$/,'')}/pages/sticker-add?${params.toString()}`;
  try { window.top.location.href = handoffUrl; }
  catch {
    const a = document.createElement('a');
    a.href = handoffUrl; a.target = '_top';
    document.body.appendChild(a); a.click(); a.remove();
  }
}
</script>
</body>
</html>
